name: build-toprmrproducer-ui
# Build the UI from toprmrproducer/voice-engine and push to GHCR.
# Runs on demand; the VM then pulls the result.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roshtarg-cpu/Focalvoice
        uses: actions/checkout@v4
        with:
          repository: roshtarg-cpu/Focalvoice
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/roshtarg-cpu/toprmrproducer-ui:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://34-131-30-241.sslip.io
            NEXT_PUBLIC_BRAND_NAME=Focal Voice
            NEXT_PUBLIC_BRAND_TAGLINE=AI voice agents that actually close
          cache-from: type=gha,scope=toprmrproducer-ui
          cache-to: type=gha,mode=max,scope=toprmrproducer-ui
